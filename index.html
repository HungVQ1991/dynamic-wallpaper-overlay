<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Dynamic Weather Wallpaper</title>
    <script src="wallpaper.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }
    </style>
</head>

    <canvas id="glcanvas"></canvas>

    <script>
        const LATITUDE = 21.0285;
        const LONGITUDE = 105.8542;
        const WEATHER_UPDATE_INTERVAL_MS = 10 * 60 * 1000;

        function getAstronomicalMoonPhase(date = new Date()) {
            const SYNODIC_MONTH_MS = 29.530588853 * 86400000;
            const KNOWN_NEW_MOON_MS = Date.UTC(2000, 0, 6, 18, 14, 0);
            const phase = ((date.getTime() - KNOWN_NEW_MOON_MS) % SYNODIC_MONTH_MS) / SYNODIC_MONTH_MS;
            return phase < 0 ? phase + 1.0 : phase;
        }

        function calculateMoonBoost(cloudDensity, moonPhaseVal) {
            const p = (moonPhaseVal !== undefined) ? moonPhaseVal : targetWeather.moonPhase;
            const m = Math.max(0.0, Math.min(1.0, 1.0 - Math.abs(2.0 * p - 1.0)));
            return 1.00 + m * 0.60;
        }

        function calculateRealTimeOfDay() {
            const now = new Date();
            const seconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() * 0.001;
            return seconds / 86400.0;
        }

        let targetWeather = {
            cloudDensity: 0.5,
            rainIntensity: 0.0,
            windSpeed: 0.15,
            windRad: 45.0 * (Math.PI / 180.0),
            windDir: [0.7071, 0.353],
            sunriseHour: 6.0,
            sunsetHour: 18.0,
            moonPhase: getAstronomicalMoonPhase()
        };

        let currentWeather = {

        const bakeFsSource = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;
uniform sampler2D u_texture;

#define DEFAULT_IMAGE_ASPECT 2.155

float getLuminance(vec3 color) {
    return dot(color, vec3(0.299, 0.587, 0.114));
}

float sdCapsule(vec2 p, vec2 a, vec2 b, float r) {
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    return length(pa - ba * h) - r;
}

float capsuleMask(vec2 uv, vec2 a, vec2 b, float r, float soft) {
    vec2 S = vec2(DEFAULT_IMAGE_ASPECT, 1.0);
    return smoothstep(0.0, soft, sdCapsule(uv * S, a * S, b * S, r));
}

float getMetalWingMask(vec2 uv) {
    if (uv.x < 0.08 || uv.x > 0.42 || uv.y < 0.22 || uv.y > 0.74) return 1.0;
    float m = 1.0;
    m = min(m, capsuleMask(uv, vec2(0.12, 0.48), vec2(0.31, 0.57), 0.065, 0.03));
    m = min(m, capsuleMask(uv, vec2(0.15, 0.63), vec2(0.33, 0.60), 0.060, 0.03));
    m = min(m, capsuleMask(uv, vec2(0.18, 0.30), vec2(0.32, 0.51), 0.065, 0.03));
    m = min(m, capsuleMask(uv, vec2(0.26, 0.42), vec2(0.36, 0.58), 0.075, 0.03));
    return m;
}

float getCharacterMask(vec2 uv) {
    if (uv.x < 0.06 || uv.x > 0.78 || uv.y < 0.15 || uv.y > 0.96) return 1.0;

    float m = getMetalWingMask(uv);
    m = min(m, capsuleMask(uv, vec2(0.39, 0.82), vec2(0.37, 0.60), 0.090, 0.05));
    m = min(m, capsuleMask(uv, vec2(0.39, 0.82), vec2(0.46, 0.91), 0.045, 0.03));
    m = min(m, capsuleMask(uv, vec2(0.37, 0.60), vec2(0.44, 0.55), 0.060, 0.04));
    m = min(m, capsuleMask(uv, vec2(0.41, 0.66), vec2(0.50, 0.68), 0.035, 0.03));

    m = min(m, capsuleMask(uv, vec2(0.37, 0.31), vec2(0.50, 0.30), 0.090, 0.05));
    m = min(m, capsuleMask(uv, vec2(0.47, 0.42), vec2(0.58, 0.58), 0.100, 0.05));
    m = min(m, capsuleMask(uv, vec2(0.56, 0.55), vec2(0.66, 0.32), 0.100, 0.06));
    return m;
}

float rectSoft(vec2 uv, vec2 lo, vec2 hi, float s) {
    vec2 a = smoothstep(lo - s, lo, uv);
    vec2 b = 1.0 - smoothstep(hi, hi + s, uv);
    return a.x * a.y * b.x * b.y;
}

float getReflectionZone(vec2 uv) {
    float z = 0.0;
    z = max(z, rectSoft(uv, vec2(0.32, 0.84), vec2(0.54, 1.00), 0.03));
    z = max(z, rectSoft(uv, vec2(0.57, 0.74), vec2(0.75, 1.00), 0.03));
    z = max(z, rectSoft(uv, vec2(0.76, 0.25), vec2(0.93, 1.00), 0.03));
    return z;
}

float getTopLeftZone(vec2 uv) {
    float xZone = 1.0 - smoothstep(0.30, 0.44, uv.x);
    float yZone = smoothstep(0.42, 0.56, uv.y);
    return xZone * yZone;
}

float getWaterMask(vec2 uv, vec3 baseColor, float charMask) {
    float lum = getLuminance(baseColor);
    float refl = getReflectionZone(uv);
    float tl   = getTopLeftZone(uv);
    float noMask = max(refl, tl);

    float m = uv.x + 0.15 * uv.y;
    float petalZone = 1.0 - smoothstep(0.80, 0.95, m);
    float isPetal   = smoothstep(0.38, 0.55, lum);
    float flowerMask = 1.0 - petalZone * isPetal * (1.0 - noMask);

    float leafZone  = 1.0 - smoothstep(0.40, 0.52, uv.y);
    float isRedLeaf = smoothstep(0.06, 0.20, baseColor.r - baseColor.b);
    float leafMask  = 1.0 - leafZone * isRedLeaf * (1.0 - noMask);

    float wm = smoothstep(0.40, 0.43, uv.x) * (1.0 - smoothstep(0.55, 0.58, uv.x))
             * (1.0 - smoothstep(0.15, 0.19, uv.y));
    float wmMask = 1.0 - wm;

    float btmLeftFlowers = 1.0 - rectSoft(uv, vec2(-0.05, -0.05), vec2(0.23, 0.32), 0.04);

    return clamp(charMask * flowerMask * leafMask * wmMask * btmLeftFlowers, 0.0, 1.0);
}

void main() {
    vec3 rawColor = texture(u_texture, v_uv).rgb;
    float charMask = getCharacterMask(v_uv);
    float waterMask = getWaterMask(v_uv, rawColor, charMask);
    float wingMask = getMetalWingMask(v_uv);

    float bgLakeMask = smoothstep(0.60, 0.90, v_uv.y);
    float regionExclusion = 1.0 - smoothstep(0.20, 0.25, v_uv.x) * (1.0 - smoothstep(0.49, 0.54, v_uv.x)) * smoothstep(0.69, 0.74, v_uv.y) * (1.0 - smoothstep(1.02, 1.07, v_uv.y));
    float mistDepthMask = bgLakeMask * charMask * regionExclusion;

    float shallowZone = smoothstep(0.14, 0.24, v_uv.x) * (1.0 - smoothstep(0.76, 0.86, v_uv.x))
                      * smoothstep(0.04, 0.14, v_uv.y) * (1.0 - smoothstep(0.66, 0.76, v_uv.y));
    float causticMask = shallowZone * waterMask * wingMask;

    fragColor = vec4(waterMask, mistDepthMask, causticMask, 1.0);
}`;
        const fsSource = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform vec2 u_imageResolution;
uniform int u_scaleMode;
uniform float u_time;
uniform sampler2D u_texture;
uniform sampler2D u_maskTexture;

uniform float u_rainIntensity;
uniform float u_windSpeed;
uniform vec3 u_windParams;
uniform float u_moonBoost;

uniform vec3 u_ambient;
uniform vec4 u_dayNightFactors;
uniform vec4 u_weatherFactors;
uniform vec4 u_mistParams;
uniform float u_isFullMoonNight;

uniform float u_causticBoost;
uniform float u_rayBoost;
uniform float u_glintBoost;
uniform float u_starBoost;
uniform float u_rippleBoost;

#define DEFAULT_IMAGE_ASPECT 2.155

float hash21(vec2 p) {
    p = fract(p * vec2(233.34, 851.73));
    p += dot(p, p + 23.45);
    return fract(p.x * p.y);
}

vec2 hash22(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.xx + p3.yz) * p3.zy);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);

    vec4 xs = i.x + vec4(0.0, 1.0, 0.0, 1.0);
    vec4 ys = i.y + vec4(0.0, 0.0, 1.0, 1.0);

    vec4 p0 = fract(xs * 233.34);
    vec4 p1 = fract(ys * 851.73);
    vec4 d = p0 * (p0 + 23.45) + p1 * (p1 + 23.45);
    p0 += d;
    p1 += d;
    vec4 h = fract(p0 * p1);

    return mix(mix(h.x, h.y, u.x), mix(h.z, h.w, u.x), u.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
    for (int i = 0; i < 3; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

float getLuminance(vec3 color) {
    return dot(color, vec3(0.299, 0.587, 0.114));
}

vec2 getWaterRipples(vec2 uv, float rainIntensity, float time, float waterMask) {
    if (rainIntensity <= 0.01 || waterMask <= 0.005) return vec2(0.0);

    float depthProgress = clamp(uv.y * 0.75 + uv.x * 0.25, 0.0, 1.0);
    float perspectiveScale = mix(1.35, 0.78, depthProgress);
    float distFactor = mix(1.0, 0.5, clamp(uv.y, 0.0, 1.0));

    vec2 totalNormal = vec2(0.0);
    float gridScale = 10.8;
    vec2 gv = uv * gridScale;
    vec2 id = floor(gv);

    mat2 rotGround = mat2(0.9492, 0.3146, -0.3146, 0.9492);
    float norm = clamp(rainIntensity * 0.15, 0.0, 1.0);
    float cellThreshold = 0.88 - norm * 0.55;

    for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
            vec2 cellOffset = vec2(float(x), float(y));
            vec2 cellId = id + cellOffset;

            float speedBase = 0.8 + hash21(cellId + 0.1) * 0.35;
            float cellTime = mod(time, 256.0 / speedBase);
            float totalProgress = cellTime * speedBase + hash21(cellId + 0.45) * 100.0;

            float cycleIndex = floor(totalProgress);
            float dropTime = fract(totalProgress);

            float cyc = mod(cycleIndex, 256.0);
            vec2 dynamicSeed = cellId + vec2(cyc * 17.13, cyc * 31.41);

            if (hash21(dynamicSeed) > cellThreshold) {
                vec2 dropPos = hash22(dynamicSeed + 0.73) * 0.7 + 0.15;
                vec2 p = gv - (cellId + dropPos);

                p = rotGround * p;
                p.y *= perspectiveScale;

                float maxRadius = mix(0.48, 0.75, hash21(dynamicSeed + 0.2)) * distFactor;
                float waveRadius = dropTime * maxRadius;

                float distSq = dot(p, p);
                if (distSq < waveRadius * waveRadius && distSq > 0.00001) {
                    float dist = sqrt(distSq);
                    float waveDist = waveRadius - dist;
                    float waveWidth = 0.075 * distFactor;
                    float rippleProfile = sin(waveDist / waveWidth * 6.2831853);
                    float edgeFade = smoothstep(0.0, 0.03 * distFactor, waveDist) * (1.0 - smoothstep(waveWidth * 1.5, waveWidth * 2.5, waveDist));
                    float xDrop = 1.0 - dropTime;
                    float lifeFade = xDrop * (xDrop * 0.5 + 0.5);
                    float strength = rippleProfile * edgeFade * lifeFade;

                    vec2 grad = p / dist;
                    totalNormal += grad * strength * (0.015 * distFactor);
                }
            }
        }
    }
    return totalNormal * (waterMask * (norm * 0.35 + 0.03));
}

float getForegroundRain(vec2 uv, float rainIntensity, float time) {
    if (rainIntensity <= 0.01) return 0.0;

    float norm = clamp(rainIntensity * 0.15, 0.0, 1.0);
    vec2 rainUV = uv;
    rainUV.x -= (1.0 - rainUV.y) * u_windParams.z;

    float t = mod(time, 256.0);
    float streak = 0.0;

    float prob1 = min(norm * 0.165, 0.165);
    vec2 st1 = vec2(rainUV.x * 41.0, rainUV.y * 1.4 + t * 19.0);
    vec2 id1 = floor(st1);
    vec2 gv1 = fract(st1);
    float h1 = hash21(id1 + vec2(7.8, 3.4));
    if (h1 < prob1) {
        float dropX = hash21(id1 + vec2(13.5, 47.1)) * 0.74 + 0.13;
        float dropTilt = (hash21(id1 + vec2(3.1, 8.9)) - 0.5) * 0.05;
        float dx = abs(gv1.x - (dropX + (gv1.y - 0.5) * dropTilt));
        float dy = gv1.y;
        streak += smoothstep(0.038, 0.0, dx) * smoothstep(0.0, 0.90, dy) * (1.0 - smoothstep(0.85, 1.0, dy));
    }

    vec2 st2 = vec2(rainUV.x * 59.0 + 17.3, rainUV.y * 1.8 + t * 25.0 + 31.5);
    vec2 id2 = floor(st2);
    vec2 gv2 = fract(st2);
    float h2 = hash21(id2 + vec2(19.1, 63.7));
    if (h2 < prob1) {
        float dropX = hash21(id2 + vec2(81.2, 23.9)) * 0.74 + 0.13;
        float dropTilt = (hash21(id2 + vec2(15.4, 71.2)) - 0.5) * 0.05;
        float dx = abs(gv2.x - (dropX + (gv2.y - 0.5) * dropTilt));
        float dy = gv2.y;
        streak += smoothstep(0.038, 0.0, dx) * smoothstep(0.0, 0.90, dy) * (1.0 - smoothstep(0.85, 1.0, dy));
    }

    return streak * 0.07;
}

float getBackgroundRain(vec2 uv, float rainIntensity, float time) {
    if (rainIntensity <= 0.01) return 0.0;
    float waterDepthMask = smoothstep(0.35, 0.65, uv.y);
    if (waterDepthMask <= 0.01) return 0.0;

    float norm = clamp(rainIntensity * 0.15, 0.0, 1.0);
    vec2 rainUV = uv;
    rainUV.x -= (1.0 - rainUV.y) * (u_windParams.z * 0.85);

    float t = mod(time, 256.0);
    float streak = 0.0;

    float prob2 = min(norm * 0.270, 0.270);
    vec2 st1 = vec2(rainUV.x * 79.0, rainUV.y * 2.2 + t * 22.0);
    vec2 id1 = floor(st1);
    vec2 gv1 = fract(st1);
    float h1 = hash21(id1 + vec2(1.2, 9.8));
    if (h1 < prob2) {
        float dropX = hash21(id1 + vec2(51.3, 17.4)) * 0.74 + 0.13;
        float dropTilt = (hash21(id1 + vec2(5.4, 2.1)) - 0.5) * 0.04;
        float dx = abs(gv1.x - (dropX + (gv1.y - 0.5) * dropTilt));
        float dy = gv1.y;
        streak += smoothstep(0.032, 0.0, dx) * smoothstep(0.0, 0.90, dy) * (1.0 - smoothstep(0.85, 1.0, dy));
    }

    vec2 st2 = vec2(rainUV.x * 113.0 + 29.1, rainUV.y * 2.7 + t * 28.0 + 47.3);
    vec2 id2 = floor(st2);
    vec2 gv2 = fract(st2);
    float h2 = hash21(id2 + vec2(37.5, 82.3));
    if (h2 < prob2) {
        float dropX = hash21(id2 + vec2(93.8, 64.1)) * 0.74 + 0.13;
        float dropTilt = (hash21(id2 + vec2(11.7, 43.6)) - 0.5) * 0.04;
        float dx = abs(gv2.x - (dropX + (gv2.y - 0.5) * dropTilt));
        float dy = gv2.y;
        streak += smoothstep(0.032, 0.0, dx) * smoothstep(0.0, 0.90, dy) * (1.0 - smoothstep(0.85, 1.0, dy));
    }

    return streak * 0.038 * waterDepthMask;
}

float getUnderwaterCaustics(vec2 uv, float animTime, float causticMask) {
    if (causticMask <= 0.005 || uv.y > 0.72 || uv.x < 0.18 || uv.x > 0.82) return 0.0;

    vec2 p = vec2(uv.x * DEFAULT_IMAGE_ASPECT, uv.y * 1.45) * 16.0;
    vec2 t1 = mod(vec2(animTime * 0.45, -animTime * 0.32), 2048.0);
    vec2 t2 = mod(vec2(-animTime * 0.38, animTime * 0.41), 2048.0);

    float n1 = abs(noise(p + t1) - 0.5);
    float n2 = abs(noise(p * 1.35 + vec2(4.2, 8.7) + t2) - 0.5);
    float ridge1 = 1.0 - smoothstep(0.0, 0.11, n1);
    float ridge2 = 1.0 - smoothstep(0.0, 0.11, n2);

    return pow(ridge1 * ridge2, 1.35) * causticMask;
}

vec3 getCrepuscularRays(vec2 uv, float animTime, float dawnRay, float sunsetRay, float dawnFactor, float sunsetFactor, float cloudCover, float normRain, float origLum) {
    float rayWindow = max(dawnRay, sunsetRay) * clamp(1.0 - cloudCover, 0.0, 1.0) * (1.0 - normRain);
    if (rayWindow <= 0.01) return vec3(0.0);

    vec2 rel = uv - vec2(-0.05, 1.05);
    float beamCoord = rel.x * 0.78 + rel.y * 0.62;
    float distFromCorner = length(rel * vec2(0.65, 1.0));
    float radialFade = (1.0 - smoothstep(0.15, 1.35, distFromCorner)) * smoothstep(0.10, 0.85, uv.y);
    if (radialFade <= 0.005) return vec3(0.0);

    float shift = mod(animTime * 0.035, 2048.0);
    float ray1 = noise(vec2(beamCoord * 11.0 + shift, uv.y * 0.6));
    float ray2 = noise(vec2(beamCoord * 23.0 - shift * 0.7, uv.y * 0.9 + 5.3));
    float shafts = smoothstep(0.45, 0.88, ray1 * 0.65 + ray2 * 0.35);

    vec3 dawnRayCol   = vec3(1.00, 0.90, 0.78);
    vec3 sunsetRayCol = vec3(1.00, 0.60, 0.35);
    vec3 rayCol = mix(dawnRayCol, sunsetRayCol, sunsetFactor / (dawnFactor + sunsetFactor + 0.0001));

    float antiClip = 1.0 - origLum * 0.55;
    return rayCol * (shafts * radialFade * rayWindow * antiClip * 0.22);
}

void main() {
    vec2 uv = v_uv;

    if (u_scaleMode == 0 && (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0)) {
        fragColor = vec4(0.0, 0.0, 0.0, 1.0);
        return;
    }

    float imageAspect = (u_imageResolution.y > 0.0) ? (u_imageResolution.x / u_imageResolution.y) : DEFAULT_IMAGE_ASPECT;
    float animTime = mod(u_time, 86400.0);
    float iTime = u_time;

    float dayFactor = u_dayNightFactors.x;
    float nightFactor = u_dayNightFactors.y;
    float dawnFactor = u_dayNightFactors.z;
    float sunsetFactor = u_dayNightFactors.w;

    float normRain = u_weatherFactors.x;
    float finalCloudCover = u_weatherFactors.y;
    float dawnRay = u_weatherFactors.z;
    float sunsetRay = u_weatherFactors.w;

    vec3 mistColor = u_mistParams.rgb;
    float morningMistWindow = u_mistParams.a;

    vec3 ambient = u_ambient;
    float isFullMoonNight = u_isFullMoonNight;
    float moonBoost = u_moonBoost;
    float rainIntensity = u_rainIntensity;

    vec4 maskData = texture(u_maskTexture, uv);
    float waterMask = maskData.r;
    float mistDepthMask = maskData.g;
    float causticMask = maskData.b;

    vec2 rippleOffset = getWaterRipples(uv, rainIntensity, iTime, waterMask) * u_rippleBoost;
    vec2 distortedUV = clamp(uv + rippleOffset, 0.0, 1.0);

    vec3 baseColor = texture(u_texture, distortedUV).rgb;
    float origLum = getLuminance(baseColor);

    float effectiveCloudFactor = 1.0;
    if (dayFactor > 0.01) {
        float windSpeed = u_windSpeed;
        vec2 cloudUV = vec2(uv.x * imageAspect, uv.y) * 1.25 + mod(u_windParams.xy * (animTime * windSpeed), 2048.0);

        float cloudNoise = fbm(cloudUV);
        float cloudThreshold = mix(0.62, 0.30, finalCloudCover);
        float cloudMask = smoothstep(cloudThreshold, cloudThreshold + 0.18, cloudNoise);

        float cloudDimming = mix(0.12, 0.25, finalCloudCover);
        float rawCloudFactor = mix(1.0, 1.0 - cloudDimming, cloudMask);
        effectiveCloudFactor = mix(1.0, rawCloudFactor, dayFactor);
    }

    vec3 nightProcessed = pow(baseColor, vec3(1.0 + nightFactor * 0.30));
    vec3 color = mix(nightProcessed, baseColor, dayFactor) * ambient;
    color *= effectiveCloudFactor;

    if (dayFactor > 0.20 && normRain < 0.60) {
        float caustics = getUnderwaterCaustics(distortedUV, animTime, causticMask);
        vec3 causticTint = mix(vec3(0.88, 0.96, 1.00), vec3(1.00, 0.82, 0.60), sunsetFactor);
        float sunVisibility = smoothstep(0.20, 0.55, dayFactor) * (1.0 - finalCloudCover * 0.65) * (1.0 - normRain);
        color += causticTint * (caustics * 0.22 * max(0.0, sunVisibility) * u_causticBoost);
    }

    color += getCrepuscularRays(uv, animTime, dawnRay, sunsetRay, dawnFactor, sunsetFactor, finalCloudCover, normRain, origLum) * u_rayBoost;

    if (morningMistWindow > 0.01 && mistDepthMask > 0.01) {
        vec2 mistUV = vec2(uv.x * imageAspect, uv.y) * vec2(1.0, 2.5) + vec2(mod(animTime * 0.03, 2048.0), 0.0);
        float mistNoise = fbm(mistUV);

            const sunsetRay = sunsetFactor * (1.0 - smoothstep(sunset - 0.15, sunset + 0.30, currentHour));

            const normRain = Math.max(0.0, Math.min(1.0, currentWeather.rainIntensity * 0.15));
            const finalCloudCover = Math.max(0.0, Math.min(1.0, currentWeather.cloudDensity + normRain * 0.35));
            const lightIntensity = Math.max(0.30, Math.min(1.0, 1.05 - finalCloudCover * 0.60));

            const dayR = mix(0.85, 1.04, lightIntensity);
            const dayG = mix(0.88, 1.00, lightIntensity);
            const dayB = mix(0.94, 0.96, lightIntensity);

            const dawnR = mix(1.02, 1.14, lightIntensity);
            const dawnG = mix(0.92, 0.98, lightIntensity);
            const dawnB = mix(0.88, 0.90, lightIntensity);

            const sunsetR = mix(1.15, 1.35, lightIntensity);
            const sunsetG = mix(0.70, 0.78, lightIntensity);
            const sunsetB = mix(0.50, 0.45, lightIntensity);

            const nightR = 0.22 * currentWeather.moonBoost;
            const nightG = 0.32 * currentWeather.moonBoost;
            const nightB = 0.55 * currentWeather.moonBoost;

            let ambR = mix(nightR, dayR, dayFactor);
            let ambG = mix(nightG, dayG, dayFactor);
            let ambB = mix(nightB, dayB, dayFactor);

            const effDawnCoeff = 0.65 + 0.35 * dayFactor;
            const effDawnR = dawnR * effDawnCoeff;
            const effDawnG = dawnG * effDawnCoeff;
            const effDawnB = dawnB * effDawnCoeff;

            const effSunsetCoeff = 0.65 + 0.35 * dayFactor;
            const effSunsetR = sunsetR * effSunsetCoeff;
            const effSunsetG = sunsetG * effSunsetCoeff;
            const effSunsetB = sunsetB * effSunsetCoeff;

            const dawnWeight = dawnFactor * 0.60;
            ambR = mix(ambR, effDawnR, dawnWeight);
            ambG = mix(ambG, effDawnG, dawnWeight);
            ambB = mix(ambB, effDawnB, dawnWeight);

            const sunsetWeight = sunsetFactor * 0.60;
            ambR = mix(ambR, effSunsetR, sunsetWeight);
            ambG = mix(ambG, effSunsetG, sunsetWeight);
            ambB = mix(ambB, effSunsetB, sunsetWeight);

            const rainDim = normRain * 0.40;
            ambR = mix(ambR, ambR * 0.82, rainDim);
            ambG = mix(ambG, ambG * 0.86, rainDim);
            ambB = mix(ambB, ambB * 0.92, rainDim);

            const isFullMoonNight = Math.max(0.0, Math.min(1.0, (currentWeather.moonBoost - 1.00) / 0.60));

            const autoMist = smoothstep(sunrise - 1.2, sunrise - 0.1, currentHour) * (1.0 - smoothstep(sunrise + 0.6, sunrise + 1.8, currentHour));
            const morningMistWindow = autoMist;

            const mistProgress = smoothstep(sunrise - 0.35, sunrise + 0.35, currentHour);
            const mistDayR = mix(0.92, 1.0, dawnFactor);
            const mistDayG = mix(0.95, 0.97, dawnFactor);
            const mistDayB = mix(1.0, 0.92, dawnFactor);

            const mistR = mix(0.35, mistDayR, mistProgress);
            const mistG = mix(0.45, mistDayG, mistProgress);
            const mistB = mix(0.60, mistDayB, mistProgress);

            if (gl && program) {
                gl.uniform1f(uTimeLoc, currentTime);
                gl.uniform1f(uRainIntensityLoc, currentWeather.rainIntensity);
                gl.uniform1f(uWindSpeedLoc, currentWeather.windSpeed);
                gl.uniform3f(uWindParamsLoc, normWindX, normWindY, windSlant);
                gl.uniform1f(uMoonBoostLoc, currentWeather.moonBoost);

                gl.uniform3f(uAmbientLoc, ambR, ambG, ambB);
                gl.uniform4f(uDayNightFactorsLoc, dayFactor, nightFactor, dawnFactor, sunsetFactor);
                gl.uniform4f(uWeatherFactorsLoc, normRain, finalCloudCover, dawnRay, sunsetRay);
                gl.uniform4f(uMistParamsLoc, mistR, mistG, mistB, morningMistWindow);
                gl.uniform1f(uIsFullMoonNightLoc, isFullMoonNight);

                gl.drawArrays(gl.TRIANGLES, 0, 3);
            }
        }

        animationFrameId = requestAnimationFrame(render);
    
    
    
    
    
    
    
    
    
    </script>
