<head>

    <title>Dynamic Weather Wallpaper</title>
    <script src="wallpaper.js?v=20261115c"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        .webgl-fallback {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d0d7de;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            z-index: 2;
        }
    </style>
</head>

<body>
    <canvas id="glcanvas"></canvas>

    <script>
        const ICAO_STATION = "VVNB";
        const AWC_LOCAL_PROXY = "http://127.0.0.1:8765/metar";
        const AWC_API_BASE = "https://aviationweather.gov/api/data/metar";
        const LATITUDE = 21.0285;
        const LONGITUDE = 105.8542;
        const DEFAULT_UTC_OFFSET_SECONDS = 7 * 3600;

        const WEATHER_UPDATE_INTERVAL_MINUTES = 15;
        const TARGET_FPS = 30;
        const IDLE_FPS = 30;
        const MAX_DPR = 1.75;

        const SCALE_MODE = 0;

        const TIME_MODE = 0;
        const MANUAL_HOUR = 12.0;

        const CLOUD_MODE = 0;
        const MANUAL_CLOUD = 0.50;

        const RAIN_MODE = 0;
        const MANUAL_RAIN = 0.0;

        const WIND_MODE = 0;
        const MANUAL_WIND_SPEED_KMH = 10.0;
        const MANUAL_WIND_DEG = 45.0;

        const MIST_MODE = 0;
        const MANUAL_MIST = 0.0;

        const CLOUD_SHADOW_BOOST = 1.0;
        const MOON_BOOST = 1.0;
        const CAUSTIC_BOOST = 1.0;
        const RAY_BOOST = 1.0;
        const GLINT_BOOST = 1.0;
        const STAR_BOOST = 1.0;
        const RIPPLE_BOOST = 1.0;
        const FIREFLY_BOOST = 2.0;
        const METEOR_BOOST = 1.0;
        const METEOR_SHOWER_ALWAYS_ON = false;

        const CLOUD_DRIFT_SPEED_SCALE = 2.0 / 5.0;
        const WEATHER_UPDATE_INTERVAL_MS = WEATHER_UPDATE_INTERVAL_MINUTES * 60 * 1000;
        const WEATHER_FETCH_TIMEOUT_MS = 10000;
        const MIN_VISIBILITY_FETCH_INTERVAL_MS = 60000;
        const MAX_METAR_AGE_MINUTES = 90;
        const WEATHER_CACHE_KEY = "weather_wallpaper_awc_cache_v4";
        const TIME_WRAP_SECONDS = 3840.0;
        const NOISE_TEX_SIZE = 256;
        const SYNODIC_MONTH_MS = 29.530588853 * 86400000;
        const KNOWN_NEW_MOON_MS = Date.UTC(2000, 0, 6, 18, 14, 0);
        const KNOTS_TO_KMH = 1.852;

        function getAstronomicalMoonPhase(nowMs = Date.now()) {
            const phase = ((nowMs - KNOWN_NEW_MOON_MS) % SYNODIC_MONTH_MS) / SYNODIC_MONTH_MS;
            return phase < 0 ? phase + 1.0 : phase;
        }

        function calculateSunTimes(lat, lon, nowMs, utcOffsetSeconds) {
            const deg2rad = Math.PI / 180.0;
            const rad2deg = 180.0 / Math.PI;
            const localDate = new Date(nowMs + utcOffsetSeconds * 1000);
            const startOfYear = Date.UTC(localDate.getUTCFullYear(), 0, 0);
            const dayOfYear = Math.floor((Date.UTC(localDate.getUTCFullYear(), localDate.getUTCMonth(), localDate.getUTCDate()) - startOfYear) / 86400000);

            const gamma = (2.0 * Math.PI / 365.0) * (dayOfYear - 1);
            const eqTime = 229.18 * (0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma)
                - 0.014615 * Math.cos(2.0 * gamma) - 0.040849 * Math.sin(2.0 * gamma));
            const decl = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma)
                - 0.006758 * Math.cos(2.0 * gamma) + 0.000907 * Math.sin(2.0 * gamma)
                - 0.002697 * Math.cos(3.0 * gamma) + 0.00148 * Math.sin(3.0 * gamma);

            const zenith = 90.833 * deg2rad;
            const cosH = (Math.cos(zenith) / (Math.cos(lat * deg2rad) * Math.cos(decl))) - Math.tan(lat * deg2rad) * Math.tan(decl);
            const clampedCosH = Math.max(-1.0, Math.min(1.0, cosH));
            const haDeg = Math.acos(clampedCosH) * rad2deg;

            const tzHours = utcOffsetSeconds / 3600.0;
            const solarNoonMin = 720.0 - 4.0 * lon - eqTime + tzHours * 60.0;
            const sunriseHour = Math.max(0.0, Math.min(23.99, (solarNoonMin - haDeg * 4.0) / 60.0));
            const sunsetHour = Math.max(0.0, Math.min(23.99, (solarNoonMin + haDeg * 4.0) / 60.0));
            return { sunriseHour, sunsetHour };
        }

        function calculateMoonBoost(moonPhaseVal) {
            const p = (moonPhaseVal !== undefined) ? moonPhaseVal : targetWeather.moonPhase;
            const m = Math.max(0.0, Math.min(1.0, 1.0 - Math.abs(2.0 * p - 1.0)));
            return (1.00 + m * 0.60) * MOON_BOOST;
        }

        function getMetarObsEpochSec(metar) {
            if (!metar || typeof metar !== "object") return NaN;
            if (typeof metar.obsTime === "number" && Number.isFinite(metar.obsTime)) {
                return metar.obsTime > 1e12 ? (metar.obsTime / 1000.0) : metar.obsTime;
            }
            if (typeof metar.reportTime === "string" && metar.reportTime.trim() !== "") {
                const normalized = metar.reportTime.includes("T")
                    ? metar.reportTime
                    : metar.reportTime.replace(" ", "T") + "Z";
                const parsedMs = Date.parse(normalized);
                if (Number.isFinite(parsedMs)) return parsedMs / 1000.0;
            }
            return NaN;
        }

        function parseMetarCloudCover(clouds, wxString, rawOb) {
            if (typeof rawOb === "string") {
                const rawTokens = rawOb.trim().toUpperCase().split(/\s+/);
                if (rawTokens.includes("CAVOK") || rawTokens.includes("NSC") || rawTokens.includes("NCD")) {
                    return 0.05;
                }
            }
            const coverWeights = {
                SKC: 0.02,
                CLR: 0.02,
                FEW: 0.20,
                SCT: 0.45,
                BKN: 0.78,
                OVC: 0.96,
                OVX: 1.00,
                VV: 1.00
            };
            let maxCover = 0.05;
            if (Array.isArray(clouds) && clouds.length > 0) {
                for (const layer of clouds) {
                    if (layer && typeof layer.cover === "string") {
                        const w = coverWeights[layer.cover.toUpperCase()];
                        if (w !== undefined && w > maxCover) {
                            maxCover = w;
                        }
                    }
                }
            }
            if (typeof wxString === "string" && wxString.trim() !== "") {
                const wxTokens = wxString.trim().toUpperCase().split(/\s+/);
                for (const tok of wxTokens) {
                    if (tok.includes("FG") || tok.includes("TS")) {
                        maxCover = Math.max(maxCover, 0.92);
                    }
                }
            }
            return maxCover;
        }

        function parseMetarRainMm(wxString) {
            if (typeof wxString !== "string" || wxString.trim() === "") return 0.0;
            const tokens = wxString.trim().toUpperCase().split(/\s+/);
            let maxMm = 0.0;

            for (const token of tokens) {
                if (!token) continue;
                if (token.startsWith("VC")) {
                    if (token === "VCTS") maxMm = Math.max(maxMm, 0.5);
                    else if (token === "VCSH") maxMm = Math.max(maxMm, 0.4);
                    continue;
                }

                const isHeavy = token.startsWith("+");
                const isLight = token.startsWith("-");
                const core = (isHeavy || isLight) ? token.slice(1) : token;
                if (!core) continue;

                const hasTs = core.includes("TS");
                const hasRa = core.includes("RA");
                const hasDz = core.includes("DZ");
                const hasGr = core.includes("GR") || core.includes("GS") || core.includes("PL") || core.includes("UP");
                const isStandaloneSh = core === "SH" || core === "SHVC";

                if (hasTs) {
                    if (hasRa) {
                        maxMm = Math.max(maxMm, isHeavy ? 16.0 : (isLight ? 2.2 : 9.0));
                    } else {
                        maxMm = Math.max(maxMm, isHeavy ? 2.0 : 0.8);
                    }
                } else if (hasRa) {
                    maxMm = Math.max(maxMm, isHeavy ? 15.0 : (isLight ? 1.8 : 7.5));
                } else if (hasDz) {
                    maxMm = Math.max(maxMm, isHeavy ? 1.2 : (isLight ? 0.3 : 0.6));
                } else if (isStandaloneSh) {
                    maxMm = Math.max(maxMm, isHeavy ? 10.0 : (isLight ? 1.5 : 5.0));
                } else if (hasGr) {
                    maxMm = Math.max(maxMm, isHeavy ? 10.0 : (isLight ? 1.5 : 5.0));
                }
            }

            return maxMm;
        }

        function parseMetarVisibilityMiles(rawVisib) {
            if (typeof rawVisib === "number" && Number.isFinite(rawVisib)) return rawVisib;
            if (typeof rawVisib === "string") {
                const trimmed = rawVisib.trim();
                if (trimmed === "6+" || trimmed === "10+") return 10.0;
                const parsed = parseFloat(trimmed.replace("+", ""));
                if (Number.isFinite(parsed)) return parsed;
            }
            return 10.0;
        }

        function parseMetarMistState(visibMiles, wxString, tempC, dewpC) {
            let mist = 0.0;
            let warmth = 0.0;

            if (visibMiles < 6.2) {
                const visNorm = Math.max(0.0, Math.min(1.0, (6.2 - visibMiles) / 5.7));
                mist = Math.max(mist, Math.pow(visNorm, 0.85) * 0.95);
            }

            if (typeof wxString === "string" && wxString.trim() !== "") {
                const tokens = wxString.trim().toUpperCase().split(/\s+/);
                for (const tok of tokens) {
                    if (tok.includes("MIFG") || tok.includes("BCFG") || tok.includes("PRFG")) {
                        mist = Math.max(mist, 0.65);
                    } else if (tok.includes("FG")) {
                        mist = Math.max(mist, 0.88);
                    } else if (tok.includes("BR")) {
                        mist = Math.max(mist, 0.48);
                    }

                    if (tok.includes("HZ") || tok.includes("FU") || tok.includes("DU")) {
                        mist = Math.max(mist, 0.42);
                        warmth = Math.max(warmth, 0.85);
                    }
                }
            }

            if (typeof tempC === "number" && typeof dewpC === "number") {
                const spread = tempC - dewpC;
                if (spread <= 2.5) {
                    const humidMist = 0.36 * (1.0 - Math.max(0.0, spread) / 2.5);
                    if (humidMist > mist) {
                        mist = humidMist;
                    }
                }
            }

            return {
                density: Math.max(0.0, Math.min(1.0, mist)),
                warmth: Math.max(0.0, Math.min(1.0, warmth))
            };
        }

        function getTargetLocationDate(nowMs = Date.now()) {
            const offsetSec = (targetWeather.utcOffsetSeconds !== null && targetWeather.utcOffsetSeconds !== undefined)
                ? targetWeather.utcOffsetSeconds
                : DEFAULT_UTC_OFFSET_SECONDS;
            return new Date(nowMs + offsetSec * 1000);
        }

        function calculateRealTimeOfDay(nowMs = Date.now()) {
            const offsetMs = ((targetWeather.utcOffsetSeconds !== null && targetWeather.utcOffsetSeconds !== undefined)
                ? targetWeather.utcOffsetSeconds
                : DEFAULT_UTC_OFFSET_SECONDS) * 1000;
            const dayMs = (((nowMs + offsetMs) % 86400000) + 86400000) % 86400000;
            return dayMs / 86400000.0;
        }

        const initialSun = calculateSunTimes(LATITUDE, LONGITUDE, Date.now(), DEFAULT_UTC_OFFSET_SECONDS);

        let targetWeather = {
            stationId: ICAO_STATION,
            cloudDensity: 0.5,
            rainIntensity: 0.0,
            windSpeed: 0.15,
            windRad: 45.0 * (Math.PI / 180.0),
            apiMist: 0.0,
            mistWarmth: 0.0,
            sunriseHour: initialSun.sunriseHour,
            sunsetHour: initialSun.sunsetHour,
            moonPhase: getAstronomicalMoonPhase(),
            utcOffsetSeconds: DEFAULT_UTC_OFFSET_SECONDS
        };

        let currentWeather = {
            timeOfDay: 0.5,
            cloudDensity: 0.5,
            rainIntensity: 0.0,
            windSpeed: 0.15,
            windRad: 45.0 * (Math.PI / 180.0),
            apiMist: 0.0,
            mistWarmth: 0.0,
            sunriseHour: initialSun.sunriseHour,
            sunsetHour: initialSun.sunsetHour,
            moonPhase: getAstronomicalMoonPhase(),
            moonBoost: calculateMoonBoost()
        };

        function loadCachedWeather() {
            try {
                const raw = localStorage.getItem(WEATHER_CACHE_KEY);
                if (!raw) return;
                const cached = JSON.parse(raw);
                if (!cached || cached.stationId !== ICAO_STATION) return;
                if (typeof cached.cloudDensity === "number") targetWeather.cloudDensity = cached.cloudDensity;
                if (typeof cached.rainIntensity === "number") targetWeather.rainIntensity = cached.rainIntensity;
                if (typeof cached.windSpeed === "number") targetWeather.windSpeed = cached.windSpeed;
                if (typeof cached.windRad === "number") targetWeather.windRad = cached.windRad;
                if (typeof cached.apiMist === "number") targetWeather.apiMist = cached.apiMist;
                if (typeof cached.mistWarmth === "number") targetWeather.mistWarmth = cached.mistWarmth;
                if (typeof cached.sunriseHour === "number") targetWeather.sunriseHour = cached.sunriseHour;
                if (typeof cached.sunsetHour === "number") targetWeather.sunsetHour = cached.sunsetHour;
                if (typeof cached.utcOffsetSeconds === "number") targetWeather.utcOffsetSeconds = cached.utcOffsetSeconds;

                currentWeather.cloudDensity = targetWeather.cloudDensity;
                currentWeather.rainIntensity = targetWeather.rainIntensity;
                currentWeather.windSpeed = targetWeather.windSpeed;
                currentWeather.windRad = targetWeather.windRad;
                currentWeather.apiMist = targetWeather.apiMist;
                currentWeather.mistWarmth = targetWeather.mistWarmth;
                currentWeather.sunriseHour = targetWeather.sunriseHour;
                currentWeather.sunsetHour = targetWeather.sunsetHour;
            } catch (e) { }
        }

        function saveCachedWeather() {
            try {
                localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({
                    stationId: ICAO_STATION,
                    cloudDensity: targetWeather.cloudDensity,
                    rainIntensity: targetWeather.rainIntensity,
                    windSpeed: targetWeather.windSpeed,
                    windRad: targetWeather.windRad,
                    apiMist: targetWeather.apiMist,
                    mistWarmth: targetWeather.mistWarmth,
                    sunriseHour: targetWeather.sunriseHour,
                    sunsetHour: targetWeather.sunsetHour,
                    utcOffsetSeconds: targetWeather.utcOffsetSeconds
                }));
            } catch (e) { }
        }

        loadCachedWeather();

        const canvas = document.getElementById("glcanvas");
        const vsSource = `#version 300 es
in vec2 a_position;
out vec2 v_uv;
out vec2 v_aspectUV;
uniform vec4 u_uvTransform;
uniform float u_sceneAspect;
void main() {
    vec2 screenUV = a_position * 0.5 + 0.5;
    v_uv = screenUV * u_uvTransform.xy + u_uvTransform.zw;
    v_aspectUV = vec2(v_uv.x * u_sceneAspect, v_uv.y);
    gl_Position = vec4(a_position, 0.0, 1.0);
}`;

        float genericReflectable = genericWater * (1.0 - smoothstep(0.55, 0.85, v_uv.x));

    float mistBottomLimit = clamp(mistCurveY, 0.02, 0.73);

    float mistFactor = getMistHeadFactor(v_uv);

    float mistExcl2 = rectSoft(v_uv, vec2(0.472, 0.692), vec2(0.614, 0.793), 0.025);

    float mistZoneFactor = mistFactor * (1.0 - max(max(mistExcl1, mistExcl2), max(mistExcl3, mistExcl4)));
    float mistDepthMask = clamp((bgLakeMask + bottomMistZone) * charErode * mistZoneFactor, 0.0, 1.0);

    float red2Excl = rectSoft(v_uv, vec2(0.84, 0.24), vec2(0.94, 0.35), 0.02);

                    * smoothstep(0.04, 0.12, v_uv.y) * (1.0 - red1Excl) * (1.0 - red2Excl);

                     * smoothstep(-0.010, 0.010, dG2) * smoothstep(-0.010, 0.010, dG3);

    float waterMask = clamp((waterZone * baseWaterMask * wingMask + green2Zone) * charErode, 0.0, 1.0);

    fragColor = vec4(waterMask, mistDepthMask, maskReflectable, charMask);
}`;

uniform mediump vec4 u_moonParams;
uniform mediump vec4 u_miscFactors;
uniform float u_meteorWeight;
uniform float u_meteorShower;
uniform vec2 u_meteorShowerDir;
uniform vec4 u_sporadicStar;
uniform float u_wingDroplets;

#define TWO_PI 6.2831853
#define INV_NOISE_SIZE (1.0 / 256.0)

uint pcg(uint v) {
    uint s = v * 747796405u + 2891336453u;
    uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
    return (w >> 22u) ^ w;
}

float hash21i(ivec2 p) {
    return float(pcg(uint(p.x) * 1664525u + pcg(uint(p.y)))) * (1.0 / 4294967295.0);
}

vec2 hash22i(ivec2 p) {
    uint h1 = pcg(uint(p.x) * 1664525u + pcg(uint(p.y)));
    uint h2 = pcg(h1 ^ 0x9e3779b9u);
    return vec2(h1, h2) * (1.0 / 4294967295.0);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return textureLod(u_noiseTexture, (i + u + 0.5) * INV_NOISE_SIZE, 0.0).r;
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
    for (int i = 0; i < 3; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

float getLuminance(vec3 color) {
    return dot(color, vec3(0.299, 0.587, 0.114));
}

vec2 getWaterRipples(vec2 uv, vec2 aspectUV, float rainIntensity, float time, float waterMask) {
    float depthProgress = clamp(uv.y * 0.75 + uv.x * 0.25, 0.0, 1.0);
    float perspectiveScale = mix(1.25, 1.85, depthProgress);
    float distFactor = mix(1.0, 0.55, clamp(uv.y, 0.0, 1.0));

    vec2 totalNormal = vec2(0.0);
    float gridScale = 6.2;
    vec2 gv = aspectUV * gridScale;
    vec2 id = floor(gv);
    ivec2 baseId = ivec2(id);

    mat2 rotGround = mat2(0.9492, 0.3146, -0.3146, 0.9492);
    float norm = clamp(rainIntensity * 0.15, 0.0, 1.0);
    float cellThreshold = 0.88 - norm * 0.55;
    float waveWidth = 0.075 * distFactor;
    float maxWaveSpan = waveWidth * 2.5;
    float maxPossibleRadius = 0.76 * distFactor;
    float maxPossibleRadiusSq = maxPossibleRadius * maxPossibleRadius;

    for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
            ivec2 offsetI = ivec2(x, y);
            ivec2 cellIdI = baseId + offsetI;
            vec2 cellId = vec2(cellIdI);

            vec2 dBox = gv - clamp(gv, cellId + 0.15, cellId + 0.85);
            if (dot(dBox, dBox) >= maxPossibleRadiusSq) continue;

            float speedBase = 0.8 + hash21i(cellIdI + ivec2(11, 23)) * 0.35;
            float totalProgress = time * speedBase + hash21i(cellIdI + ivec2(45, 79)) * 100.0;

            int cycleIndex = int(floor(totalProgress));
            float dropTime = fract(totalProgress);

            ivec2 dynamicSeed = cellIdI + ivec2(cycleIndex * 17, cycleIndex * 31);

            if (hash21i(dynamicSeed) > cellThreshold) {
                vec2 dropPos = hash22i(dynamicSeed + ivec2(73, 19)) * 0.7 + 0.15;
                vec2 p = gv - (cellId + dropPos);

                p = rotGround * p;
                p.y *= perspectiveScale;

                float maxRadius = mix(0.48, 0.75, hash21i(dynamicSeed + ivec2(29, 53))) * distFactor;
                float waveRadius = dropTime * maxRadius;
                float innerRadius = max(0.0, waveRadius - maxWaveSpan);

                float distSq = dot(p, p);
                if (distSq < waveRadius * waveRadius && distSq > innerRadius * innerRadius && distSq > 0.00001) {
                    float dist = sqrt(distSq);
                    float waveDist = waveRadius - dist;
                    float rippleProfile = sin(waveDist / waveWidth * TWO_PI);
                    float edgeFade = smoothstep(0.0, 0.03 * distFactor, waveDist) * (1.0 - smoothstep(waveWidth * 1.5, maxWaveSpan, waveDist));
                    float xDrop = 1.0 - dropTime;
                    float lifeFade = xDrop * (xDrop * 0.5 + 0.5);
                    float strength = rippleProfile * edgeFade * lifeFade;

                    vec2 grad = p / dist;
                    totalNormal += grad * strength * (0.015 * distFactor);
                }
            }
        }
    }
    return totalNormal * (waterMask * (norm * 0.35 + 0.03));
}

float getForegroundRain(vec2 uv, float normRain, float time) {
    vec2 rainUV = uv;
    rainUV.x -= (1.0 - rainUV.y) * u_windParams.z;

    float t = mod(time, 256.0);
    float streak = 0.0;
    float tiltScale = clamp(abs(u_windParams.z) * 10.0, 0.0, 1.0);

    float prob1 = min(normRain * 0.165, 0.165);
    vec2 st1 = vec2(rainUV.x * 41.0, rainUV.y * 1.4 + t * 19.0);
    vec2 id1 = floor(st1);
    vec2 gv1 = fract(st1);
    ivec2 hashId1 = ivec2(int(id1.x), int(floor(mod(id1.y, 256.0 * 19.0) + 0.5)));
    float h1 = hash21i(hashId1 + ivec2(78, 34));
    if (h1 < prob1) {
        float dropX = hash21i(hashId1 + ivec2(135, 471)) * 0.74 + 0.13;
        float dropTilt = (hash21i(hashId1 + ivec2(31, 89)) - 0.5) * 0.05 * tiltScale;
        float dx = abs(gv1.x - (dropX + (gv1.y - 0.5) * dropTilt));
        float dy = gv1.y;
        streak += (1.0 - smoothstep(0.0, 0.042, dx)) * smoothstep(0.0, 0.90, dy) * (1.0 - smoothstep(0.85, 1.0, dy));
    }

    vec2 st2 = vec2(rainUV.x * 59.0 + 17.3, rainUV.y * 1.8 + t * 25.0 + 31.5);
    vec2 id2 = floor(st2);
    vec2 gv2 = fract(st2);
    ivec2 hashId2 = ivec2(int(id2.x), int(floor(mod(id2.y, 256.0 * 25.0) + 0.5)));
    float h2 = hash21i(hashId2 + ivec2(191, 637));
    if (h2 < prob1) {
        float dropX = hash21i(hashId2 + ivec2(812, 239)) * 0.74 + 0.13;
        float dropTilt = (hash21i(hashId2 + ivec2(154, 712)) - 0.5) * 0.05 * tiltScale;
        float dx = abs(gv2.x - (dropX + (gv2.y - 0.5) * dropTilt));
        float dy = gv2.y;
        streak += (1.0 - smoothstep(0.0, 0.042, dx)) * smoothstep(0.0, 0.90, dy) * (1.0 - smoothstep(0.85, 1.0, dy));
    }

    return streak * 0.07;
}

float getBackgroundRain(vec2 uv, float normRain, float time) {
    float waterDepthMask = smoothstep(0.35, 0.65, uv.y);
    if (waterDepthMask <= 0.01) return 0.0;

    vec2 rainUV = uv;
    rainUV.x -= (1.0 - rainUV.y) * (u_windParams.z * 0.85);

    float t = mod(time, 256.0);
    float streak = 0.0;
    float tiltScale = clamp(abs(u_windParams.z) * 10.0, 0.0, 1.0);

    float prob2 = min(normRain * 0.270, 0.270);
    vec2 st1 = vec2(rainUV.x * 79.0, rainUV.y * 2.2 + t * 22.0);
    vec2 id1 = floor(st1);
    vec2 gv1 = fract(st1);
    ivec2 hashId1 = ivec2(int(id1.x), int(floor(mod(id1.y, 256.0 * 22.0) + 0.5)));
    float h1 = hash21i(hashId1 + ivec2(12, 98));
    if (h1 < prob2) {
        float dropX = hash21i(hashId1 + ivec2(513, 174)) * 0.74 + 0.13;
        float dropTilt = (hash21i(hashId1 + ivec2(54, 21)) - 0.5) * 0.04 * tiltScale;
        float dx = abs(gv1.x - (dropX + (gv1.y - 0.5) * dropTilt));
        float dy = gv1.y;
        streak += (1.0 - smoothstep(0.0, 0.036, dx)) * smoothstep(0.0, 0.90, dy) * (1.0 - smoothstep(0.85, 1.0, dy));
    }

    vec2 st2 = vec2(rainUV.x * 113.0 + 29.1, rainUV.y * 2.7 + t * 28.0 + 47.3);
    vec2 id2 = floor(st2);
    vec2 gv2 = fract(st2);
    ivec2 hashId2 = ivec2(int(id2.x), int(floor(mod(id2.y, 256.0 * 28.0) + 0.5)));
    float h2 = hash21i(hashId2 + ivec2(375, 823));
    if (h2 < prob2) {
        float dropX = hash21i(hashId2 + ivec2(938, 641)) * 0.74 + 0.13;
        float dropTilt = (hash21i(hashId2 + ivec2(117, 436)) - 0.5) * 0.04 * tiltScale;
        float dx = abs(gv2.x - (dropX + (gv2.y - 0.5) * dropTilt));
        float dy = gv2.y;
        streak += (1.0 - smoothstep(0.0, 0.036, dx)) * smoothstep(0.0, 0.90, dy) * (1.0 - smoothstep(0.85, 1.0, dy));
    }

    return streak * 0.038 * waterDepthMask;
}

float getUnderwaterCaustics(vec2 uv, float animTime, float waterMask, float sceneAspect) {
    float depthScale = mix(1.0, 2.2, smoothstep(0.20, 0.85, uv.y));
    vec2 p = vec2(uv.x * sceneAspect, uv.y * 1.45) * (16.0 * depthScale);
    float speedScale = mix(1.0, 0.70, smoothstep(0.30, 0.85, uv.y));
    vec2 t1 = vec2(animTime * 0.45, -animTime * 0.32) * speedScale;
    vec2 t2 = vec2(-animTime * 0.38, animTime * 0.41) * speedScale;

    float n1 = abs(noise(p + t1) - 0.5);
    float n2 = abs(noise(p * 1.35 + vec2(4.2, 8.7) + t2) - 0.5);
    float ridge1 = 1.0 - smoothstep(0.0, 0.11, n1);
    float ridge2 = 1.0 - smoothstep(0.0, 0.11, n2);
    float depthFade = mix(1.0, 0.75, smoothstep(0.40, 0.85, uv.y));

    return pow(ridge1 * ridge2, 1.35) * waterMask * depthFade;
}

mediump vec3 getCrepuscularRays(vec2 uv, float animTime, mediump vec4 rayColorAndWindow, float origLum) {
    if (rayColorAndWindow.a <= 0.01) return vec3(0.0);

    vec2 rel = uv - vec2(-0.05, 1.05);
    float beamCoord = rel.x * 0.78 + rel.y * 0.62;
    float distFromCorner = length(rel * vec2(0.65, 1.0));
    float radialFade = (1.0 - smoothstep(0.15, 1.35, distFromCorner)) * smoothstep(0.10, 0.85, uv.y);
    if (radialFade <= 0.005) return vec3(0.0);

    float shift = animTime * 0.035;
    float ray1 = noise(vec2(beamCoord * 11.0 + shift, uv.y * 0.6));
    float ray2 = noise(vec2(beamCoord * 23.0 - shift * 0.7, uv.y * 0.9 + 5.3));
    float shafts = smoothstep(0.45, 0.88, ray1 * 0.65 + ray2 * 0.35);

    float antiClip = 1.0 - origLum * 0.55;
    return rayColorAndWindow.rgb * (shafts * radialFade * rayColorAndWindow.a * antiClip * 0.22);
}

mediump vec3 getShootingStars(vec2 aspectUV, float animTime, float meteorWeight, float meteorShower, vec2 showerDir, float sceneAspect, vec4 sporadicStar) {
    if (meteorWeight <= 0.005 || u_rainIntensity > 0.01) return vec3(0.0);
    vec3 totalColor = vec3(0.0);

    if (meteorShower > 0.001) {
        for (int k = 0; k < 7; k++) {
            float fk = float(k);
            float period = 2.0 + mod(fk * 1.37 + 0.4, 2.2);
            float activeDur = 0.60 + mod(fk * 0.11, 0.25);
            float cycle = floor(animTime / period);
            float tInCycle = mod(animTime, period);

            float startDelay = 0.2 + hash21i(ivec2(int(cycle * 13.0 + fk * 37.0), 19)) * max(0.1, period - activeDur - 0.4);

            if (tInCycle >= startDelay && tInCycle <= startDelay + activeDur) {
                float progress = (tInCycle - startDelay) / activeDur;

                float seed1 = hash21i(ivec2(int(cycle * 41.0 + fk * 73.0), 31));
                float seed2 = hash21i(ivec2(int(cycle * 67.0 + fk * 97.0), 53));
                float seed3 = hash21i(ivec2(int(cycle * 89.0 + fk * 17.0), 71));
                float seed4 = hash21i(ivec2(int(cycle * 113.0 + fk * 47.0), 83));
                float seed5 = hash21i(ivec2(int(cycle * 137.0 + fk * 29.0), 97));

                float sizeScale = mix(0.55, 1.00, seed4);
                float brightScale = mix(0.40, 1.00, mix(sizeScale, seed5, 0.35));
                float travelDist = mix(0.38, 0.78, mix(sizeScale, seed2, 0.40));

                float baseAngle = (length(showerDir) > 0.1) ? atan(showerDir.y, showerDir.x) : 3.65;
                float angle = baseAngle + (seed3 - 0.5) * 0.10;
                float sideChoice = hash21i(ivec2(int(cycle * 23.0 + fk * 61.0), 43));
                bool flyRight = (cos(baseAngle) > 0.0);
                vec2 startPos;
                if (flyRight) {
                    if (sideChoice < 0.5) {
                        startPos = vec2(0.0, mix(0.50, 0.98, seed2));
                    } else {
                        startPos = vec2(mix(0.01, 0.65, seed1) * sceneAspect, 1.0);
                    }
                } else {
                    if (sideChoice < 0.5) {
                        startPos = vec2(sceneAspect, mix(0.50, 0.98, seed2));
                    } else {
                        startPos = vec2(mix(0.35, 0.99, seed1) * sceneAspect, 1.0);
                    }
                }

                vec2 dir = vec2(cos(angle), sin(angle));

                vec2 headPos = startPos + dir * (progress * travelDist);
                float lifeEnvelope = smoothstep(0.0, 0.16, progress) * (1.0 - smoothstep(0.70, 1.0, progress));

                vec2 toPixel = aspectUV - headPos;
                float distAlongTail = dot(toPixel, -dir);
                vec2 perpDir = vec2(-dir.y, dir.x);
                float distPerp = abs(dot(toPixel, perpDir));

                float tailLength = (0.07 + seed1 * 0.09) * sizeScale;
                float tailBrightness = 0.0;
                if (distAlongTail >= 0.0 && distAlongTail <= tailLength) {
                    float tailWidth = mix(0.0010, 0.0002, distAlongTail / tailLength) * sizeScale;
                    float tailProfile = exp(-pow(distPerp / tailWidth, 2.0) * 2.8);
                    float tailDecay = pow(1.0 - distAlongTail / tailLength, 1.5);
                    tailBrightness = tailProfile * tailDecay * 2.4;
                }

                float headDist = length(toPixel);
                float headCore = exp(-headDist * (830.0 / sizeScale)) * 3.2;
                float headHalo = exp(-headDist * (260.0 / sizeScale)) * 0.85;
                float headBrightness = headCore + headHalo;

                float trackWeight = meteorWeight * meteorShower;
                float bright = (headBrightness + tailBrightness) * (lifeEnvelope * 0.35 * brightScale) * trackWeight;
                mediump vec3 tailCol = mix(vec3(0.55, 0.85, 1.00), vec3(1.00, 0.92, 0.72), seed3);
                mediump vec3 starCol = mix(tailCol, vec3(1.0), clamp(headCore * 0.8, 0.0, 1.0));

                totalColor += starCol * bright;
            }
        }
    } else if (sporadicStar.w > 0.005 && sporadicStar.x >= 0.0 && sporadicStar.x <= 1.0) {
        float progress = sporadicStar.x;
        float seed1 = sporadicStar.y;
        float seed2 = sporadicStar.z;
        float seed3 = fract(seed1 * 17.31 + seed2 * 31.73);
        float seed4 = fract(seed1 * 43.19 + seed2 * 59.11);
        float seed5 = fract(seed1 * 71.23 + seed2 * 83.47);

        float sizeScale = mix(0.65, 1.15, seed4);
        float brightScale = mix(0.50, 1.00, mix(sizeScale, seed5, 0.35));
        float travelDist = mix(0.40, 0.85, mix(sizeScale, seed2, 0.40));

        vec2 startPos = vec2(mix(0.05, 0.95, seed1) * sceneAspect, mix(0.55, 0.95, seed2));
        float angle = 3.14159265 + 0.25 + seed3 * (3.14159265 - 0.50);
        vec2 dir = vec2(cos(angle), sin(angle));

        vec2 headPos = startPos + dir * (progress * travelDist);
        float lifeEnvelope = smoothstep(0.0, 0.16, progress) * (1.0 - smoothstep(0.70, 1.0, progress));

        vec2 toPixel = aspectUV - headPos;
        float distAlongTail = dot(toPixel, -dir);
        vec2 perpDir = vec2(-dir.y, dir.x);
        float distPerp = abs(dot(toPixel, perpDir));

        float tailLength = (0.08 + seed1 * 0.10) * sizeScale;
        float tailBrightness = 0.0;
        if (distAlongTail >= 0.0 && distAlongTail <= tailLength) {
            float tailWidth = mix(0.0010, 0.0002, distAlongTail / tailLength) * sizeScale;
            float tailProfile = exp(-pow(distPerp / tailWidth, 2.0) * 2.8);
            float tailDecay = pow(1.0 - distAlongTail / tailLength, 1.5);
            tailBrightness = tailProfile * tailDecay * 2.4;
        }

        float headDist = length(toPixel);
        float headCore = exp(-headDist * (830.0 / sizeScale)) * 3.2;
        float headHalo = exp(-headDist * (260.0 / sizeScale)) * 0.85;
        float headBrightness = headCore + headHalo;

        float bright = (headBrightness + tailBrightness) * (lifeEnvelope * 0.38 * brightScale) * (meteorWeight * sporadicStar.w);
        mediump vec3 tailCol = mix(vec3(0.55, 0.85, 1.00), vec3(1.00, 0.92, 0.72), seed3);
        mediump vec3 starCol = mix(tailCol, vec3(1.0), clamp(headCore * 0.8, 0.0, 1.0));

        totalColor += starCol * bright;
    }

    return totalColor;
}
mediump vec3 getFireflies(vec2 uv, vec2 aspectUV, float animTime, mediump float fireflyWeight, float charMask, sampler2D maskTex, float sceneAspect) {
    if (fireflyWeight <= 0.005 || charMask <= 0.01 || u_rainIntensity > 0.01) return vec3(0.0);
    if (uv.y < 0.02 || uv.y > 0.96) return vec3(0.0);

    vec2 fp = aspectUV * 36.0;
    vec2 cell = floor(fp);
    ivec2 cellI = ivec2(cell);
    float h = hash21i(cellI);

    if (h < 0.988) return vec3(0.0);

    vec2 basePos = hash22i(cellI + ivec2(17, 83)) - 0.5;
    float phaseX = mod(animTime * 0.35 + hash21i(cellI + ivec2(113, 17)) * TWO_PI, TWO_PI);
    float phaseY = mod(animTime * 0.28 + hash21i(cellI + ivec2(237, 41)) * TWO_PI, TWO_PI);
    float phaseDrift = mod(animTime * 0.15 + hash21i(cellI + ivec2(371, 61)) * TWO_PI, TWO_PI);
    vec2 flight = vec2(sin(phaseX), cos(phaseY)) * 0.20;
    flight.x += sin(phaseDrift) * 0.06;

    vec2 center = 0.5 + basePos * 0.20 + flight;
    vec2 centerUV = vec2((cell.x + center.x) / sceneAspect, cell.y + center.y) / 36.0;
    if (centerUV.y < 0.04 || centerUV.y > 0.94) return vec3(0.0);

    float centerCharMask = textureLod(maskTex, centerUV, 0.0).a;
    if (centerCharMask < 0.60) return vec3(0.0);

    float cycleDuration = 6.5 + hash21i(cellI + ivec2(71, 13)) * 3.5;
    float flashDuration = 2.2 + hash21i(cellI + ivec2(194, 29)) * 0.8;
    float cycleTime = mod(animTime + hash21i(cellI + ivec2(318, 47)) * 100.0, cycleDuration);

    if (cycleTime >= flashDuration) return vec3(0.0);

    float progress = cycleTime / flashDuration;
    float envelope = smoothstep(0.0, 1.0, sin(progress * 3.14159265));

    float fSpeed1 = 8.0 + hash21i(cellI + ivec2(137, 53)) * 7.0;
    float fSpeed2 = 14.0 + hash21i(cellI + ivec2(291, 67)) * 9.0;
    float fPhase = hash21i(cellI + ivec2(435, 89)) * TWO_PI;
    float rawFlicker = sin(mod(animTime * fSpeed1 + fPhase, TWO_PI)) * 0.60
                     + cos(mod(animTime * fSpeed2 + fPhase * 1.5, TWO_PI)) * 0.40;
    float flicker = 0.45 + 0.55 * pow(clamp(rawFlicker * 0.5 + 0.5, 0.0, 1.0), 1.6);
    float pulse = envelope * flicker;

    float sizeRand = 0.85 + hash21i(cellI + ivec2(49, 97)) * 0.30;
    vec2 fRel = fract(fp) - center;
    float r = length(fRel);

    float core = 1.0 - smoothstep(0.0, 0.042 * sizeRand, r);
    float halo = 1.0 - smoothstep(0.0, 0.132 * sizeRand, r);
    float shape = core * 1.5 + halo * 0.60;

    mediump vec3 fireflyColor = mix(vec3(0.85, 0.95, 0.40), vec3(1.00, 0.84, 0.42), hash21i(cellI + ivec2(93, 101)));
    fireflyColor = mix(fireflyColor, vec3(1.00, 1.00, 0.92), core);

    return fireflyColor * (shape * pulse * fireflyWeight * smoothstep(0.40, 0.90, charMask));
}

float saw(float b, float t) {
    return smoothstep(0.0, b, t) * smoothstep(1.0, b, t);
}

vec4 getWingRainDroplets(vec2 aspectUV, vec3 baseCol, float animTime, float dropletVal, float normRain, float mechaMask, float dayFactor, float nightFactor, float sunsetFactor) {
    if (dropletVal <= 0.005 || mechaMask <= 0.005) return vec4(0.0);

    float t = animTime * 0.12;

    float cappedRain = min(dropletVal, 0.40);
    float dropDensity1 = clamp(cappedRain * 1.15, 0.04, 0.46);
    float spawnThresh1 = 1.0 - dropDensity1;

    vec2 s1 = aspectUV * 42.0;
    ivec2 cell1 = ivec2(floor(s1));
    float sc1 = 0.0;
    vec2 norm1 = vec2(0.0);

    if (hash21i(cell1 + ivec2(11, 47)) >= spawnThresh1) {
        vec2 st1 = fract(s1) - 0.5;
        vec2 p1 = (vec2(hash21i(cell1), hash21i(cell1 + ivec2(19, 61))) - 0.5) * 0.70;
        float sz1 = hash21i(cell1 + ivec2(77, 143));
        vec2 diff1 = st1 - p1;
        float d1 = length(diff1);
        float fade1 = 0.50 + 0.50 * saw(0.025, fract(t + sz1));
        float size1 = 0.075 + 0.028 * hash21i(cell1 + ivec2(35, 91));
        sc1 = smoothstep(size1, 0.0, d1) * (0.65 + 0.35 * fract(sz1 * 10.0)) * fade1;
        norm1 = (d1 > 0.001) ? (diff1 / d1) : vec2(0.0);
    }

    float dropDensity2 = clamp(cappedRain * 1.00, 0.05, 0.40);
    float spawnThresh2 = 1.0 - dropDensity2;

    vec2 s2 = (aspectUV + vec2(13.7, 29.1)) * 80.0;
    ivec2 cell2 = ivec2(floor(s2));
    float sc2 = 0.0;
    vec2 norm2 = vec2(0.0);

    if (hash21i(cell2 + ivec2(17, 59)) >= spawnThresh2) {
        vec2 st2 = fract(s2) - 0.5;
        vec2 p2 = (vec2(hash21i(cell2), hash21i(cell2 + ivec2(31, 83))) - 0.5) * 0.70;
        float sz2 = hash21i(cell2 + ivec2(97, 167));
        vec2 diff2 = st2 - p2;
        float d2 = length(diff2);

        async function fetchAwcMetar(stationId) {
            const encodedStation = encodeURIComponent(stationId);
            const endpoints = [
                `${AWC_LOCAL_PROXY}?ids=${encodedStation}&hours=2`,
                `${AWC_API_BASE}?ids=${encodedStation}&format=json&hours=2`
            ];

            let lastError = new Error("All AWC METAR endpoints unreachable");

            for (const targetUrl of endpoints) {
                try {
                    const data = await fetchJsonWithTimeout(targetUrl, WEATHER_FETCH_TIMEOUT_MS);
                    if (!Array.isArray(data) || data.length === 0) {
                        throw new Error("Empty METAR payload");
                    }
                    data.sort((a, b) => {
                        const ta = getMetarObsEpochSec(a);
                        const tb = getMetarObsEpochSec(b);
                        return (Number.isFinite(tb) ? tb : 0) - (Number.isFinite(ta) ? ta : 0);
                    });
                    const obsSec = getMetarObsEpochSec(data[0]);
                    if (!Number.isFinite(obsSec)) {
                        throw new Error("Missing obsTime");
                    }
                    const ageMin = (Date.now() / 1000.0 - obsSec) / 60.0;
                    if (ageMin > MAX_METAR_AGE_MINUTES) {
                        throw new Error("Stale METAR " + Math.round(ageMin) + " min");
                    }
                    return data[0];
                } catch (err) {
                    lastError = err;
                }
            }

            throw lastError;
        }

                    meteorPityState.tonightHasShower = false;
                    meteorPityState.tonightHour = -1;
                }
                try {
                    localStorage.setItem(METEOR_PITY_KEY, JSON.stringify(meteorPityState));
                } catch (e) { }
            }

            let isShowerActive = false;
            if (nightId && meteorPityState.tonightHasShower && !isRaining) {
                const curIntHour = Math.floor(currentHour);
                if (curIntHour === meteorPityState.tonightHour) {
                    isShowerActive = true;
                    if (!meteorPityState.showerTriggered) {
                        meteorPityState.showerTriggered = true;
                        meteorPityState.chance = 0.1;
                        try {
                            localStorage.setItem(METEOR_PITY_KEY, JSON.stringify(meteorPityState));
                        } catch (e) { }
                    }
                }
            }
            return isShowerActive;
        }

        function render(nowMs) {
            if (!isPageVisible) {
                animationFrameId = null;
                return;
            }

            const now = nowMs || performance.now();
            animationFrameId = requestAnimationFrame(render);

            const elapsedSinceLastRender = now - lastRenderTimeMs;
            if (lastRenderTimeMs > 0 && elapsedSinceLastRender < frameIntervalMs - 1.0) {
                return;
            }

            const isResuming = isVisibilityResumed || (lastFrameTime > 0 && (now - lastFrameTime > 500.0));
            isVisibilityResumed = false;

            const dt = (isResuming || lastFrameTime <= 0) ? 0.016 : Math.min((now - lastFrameTime) * 0.001, 0.1);
            lastFrameTime = now;
            if (lastRenderTimeMs <= 0 || isResuming) {
                lastRenderTimeMs = now;
            } else {
                lastRenderTimeMs = now - (elapsedSinceLastRender % frameIntervalMs);
            }

            accumulatedTime += dt;
            if (accumulatedTime >= TIME_WRAP_SECONDS) {
                accumulatedTime -= TIME_WRAP_SECONDS;
            }

            const weatherLerpFactor = isResuming ? 1.0 : (1.0 - Math.exp(-dt / 30.0));
            const astroLerpFactor = isResuming ? 1.0 : (1.0 - Math.exp(-3.0 * dt));

            if (TIME_MODE === 0) {
                currentWeather.timeOfDay = calculateRealTimeOfDay(Date.now());
            } else if (TIME_MODE === 1) {
                currentWeather.timeOfDay = (accumulatedTime / 15.0) % 1.0;
            } else {
                currentWeather.timeOfDay = MANUAL_HOUR / 24.0;
            }

            let effectiveCloud = targetWeather.cloudDensity;
            if (CLOUD_MODE === 1) effectiveCloud = 0.96;
            else if (CLOUD_MODE === 2) effectiveCloud = 0.05;
            else if (CLOUD_MODE === 3) effectiveCloud = Math.max(0.0, Math.min(1.0, MANUAL_CLOUD));

            let effectiveRain = 0.0;
            if (RAIN_MODE === 0) {
                effectiveRain = targetWeather.rainIntensity;
            } else if (RAIN_MODE === 1) {
                effectiveRain = 20.0 / 3.0;
            } else {
                effectiveRain = Math.min(Math.max(0.0, MANUAL_RAIN) / 3.0, 20.0 / 3.0);
            }

            let effectiveWindSpeed = 0.15;
            let effectiveWindRad = 45.0 * (Math.PI / 180.0);
            if (WIND_MODE === 0) {
                effectiveWindSpeed = targetWeather.windSpeed;
                effectiveWindRad = targetWeather.windRad;
            } else {
                effectiveWindSpeed = Math.min(0.35, MANUAL_WIND_SPEED_KMH / 50.0);
                effectiveWindRad = MANUAL_WIND_DEG * (Math.PI / 180.0);
            }
            let effectiveSunrise = targetWeather.sunriseHour;
            let effectiveSunset = targetWeather.sunsetHour;
            let effectiveMoonPhase = targetWeather.moonPhase;

            if (isResuming) {
                currentWeather.cloudDensity = effectiveCloud;
                currentWeather.rainIntensity = effectiveRain;
                currentWeather.windSpeed = effectiveWindSpeed;
                currentWeather.windRad = effectiveWindRad;
                currentWeather.apiMist = targetWeather.apiMist;
                currentWeather.mistWarmth = targetWeather.mistWarmth;
                currentWeather.sunriseHour = effectiveSunrise;
                currentWeather.sunsetHour = effectiveSunset;
                currentWeather.moonPhase = effectiveMoonPhase;
                currentWeather.moonBoost = calculateMoonBoost(currentWeather.moonPhase);
            } else {
                currentWeather.cloudDensity += (effectiveCloud - currentWeather.cloudDensity) * weatherLerpFactor;
                currentWeather.rainIntensity += (effectiveRain - currentWeather.rainIntensity) * weatherLerpFactor;
                currentWeather.windSpeed += (effectiveWindSpeed - currentWeather.windSpeed) * weatherLerpFactor;
                currentWeather.apiMist += (targetWeather.apiMist - currentWeather.apiMist) * weatherLerpFactor;
                currentWeather.mistWarmth += (targetWeather.mistWarmth - currentWeather.mistWarmth) * weatherLerpFactor;

                let dRad = effectiveWindRad - currentWeather.windRad;
                while (dRad > Math.PI) dRad -= 2.0 * Math.PI;
                while (dRad < -Math.PI) dRad += 2.0 * Math.PI;
                currentWeather.windRad += dRad * weatherLerpFactor;

                currentWeather.sunriseHour += (effectiveSunrise - currentWeather.sunriseHour) * weatherLerpFactor;
                currentWeather.sunsetHour += (effectiveSunset - currentWeather.sunsetHour) * weatherLerpFactor;

                let dMoon = effectiveMoonPhase - currentWeather.moonPhase;
                if (dMoon > 0.5) dMoon -= 1.0;
                else if (dMoon < -0.5) dMoon += 1.0;
                currentWeather.moonPhase = (currentWeather.moonPhase + dMoon * astroLerpFactor + 1.0) % 1.0;

                const effectiveMoonBoost = calculateMoonBoost(currentWeather.moonPhase);
                currentWeather.moonBoost += (effectiveMoonBoost - currentWeather.moonBoost) * astroLerpFactor;
            }

            updateAdaptiveFrameRate(now, Math.max(currentWeather.rainIntensity, effectiveRain));

            const advectX = Math.sin(currentWeather.windRad);
            const advectY = Math.cos(currentWeather.windRad) * 0.5;
            const wLen = Math.hypot(advectX, advectY);
            const normWindX = (wLen > 0.001) ? (advectX / wLen) : 0.7071;
            const normWindY = (wLen > 0.001) ? (advectY / wLen) : 0.353;
            const windSlant = (currentWeather.windSpeed > 0.001) ? (-normWindX * Math.min(0.45, currentWeather.windSpeed * 1.8)) : 0.0;
            const cloudDriftSpeed = currentWeather.windSpeed * CLOUD_DRIFT_SPEED_SCALE;

            cloudOffsetX += normWindX * cloudDriftSpeed * dt;
            cloudOffsetY += normWindY * cloudDriftSpeed * dt;
            if (cloudOffsetX >= 4096.0) cloudOffsetX -= 4096.0;
            else if (cloudOffsetX <= -4096.0) cloudOffsetX += 4096.0;
            if (cloudOffsetY >= 4096.0) cloudOffsetY -= 4096.0;
            else if (cloudOffsetY <= -4096.0) cloudOffsetY += 4096.0;

            const currentHour = currentWeather.timeOfDay * 24.0;
            const sunrise = currentWeather.sunriseHour;
            const sunset = currentWeather.sunsetHour;

            const morningRise = smoothstep(sunrise - 0.50, sunrise + 0.50, currentHour);
            const eveningSet = 1.0 - smoothstep(sunset - 0.50, sunset + 0.50, currentHour);
            const dayFactor = Math.max(0.0, Math.min(1.0, morningRise * eveningSet));
            const nightFactor = 1.0 - dayFactor;

            const dawnFactor = Math.exp(-Math.pow((currentHour - sunrise) / 0.70, 2.0));
            const sunsetFactor = Math.exp(-Math.pow((currentHour - sunset) / 0.70, 2.0));

            const dawnRay = dawnFactor * smoothstep(sunrise - 0.30, sunrise + 0.15, currentHour);
            const sunsetRay = sunsetFactor * (1.0 - smoothstep(sunset - 0.15, sunset + 0.30, currentHour));

            const normRain = Math.max(0.0, Math.min(1.0, currentWeather.rainIntensity * 0.15));
            const finalCloudCover = Math.max(0.0, Math.min(1.0, currentWeather.cloudDensity + normRain * 0.35));
            const lightIntensity = Math.max(0.30, Math.min(1.0, 1.05 - finalCloudCover * 0.60));

            const dayR = mix(0.85, 1.04, lightIntensity);
            const dayG = mix(0.88, 1.00, lightIntensity);
            const dayB = mix(0.94, 0.96, lightIntensity);

            const dawnR = mix(1.02, 1.14, lightIntensity);
            const dawnG = mix(0.92, 0.98, lightIntensity);
            const dawnB = mix(0.88, 0.90, lightIntensity);

            const sunsetR = mix(1.15, 1.35, lightIntensity);
            const sunsetG = mix(0.70, 0.78, lightIntensity);
            const sunsetB = mix(0.50, 0.45, lightIntensity);

            const nightR = 0.22 * currentWeather.moonBoost;
            const nightG = 0.32 * currentWeather.moonBoost;
            const nightB = 0.55 * currentWeather.moonBoost;

            let ambR = mix(nightR, dayR, dayFactor);
            let ambG = mix(nightG, dayG, dayFactor);
            let ambB = mix(nightB, dayB, dayFactor);

            const effDawnCoeff = 0.65 + 0.35 * dayFactor;
            const effDawnR = dawnR * effDawnCoeff;
            const effDawnG = dawnG * effDawnCoeff;
            const effDawnB = dawnB * effDawnCoeff;

            const effSunsetCoeff = 0.65 + 0.35 * dayFactor;
            const effSunsetR = sunsetR * effSunsetCoeff;
            const effSunsetG = sunsetG * effSunsetCoeff;
            const effSunsetB = sunsetB * effSunsetCoeff;

            const dawnWeight = dawnFactor * 0.60;
            ambR = mix(ambR, effDawnR, dawnWeight);
            ambG = mix(ambG, effDawnG, dawnWeight);
            ambB = mix(ambB, effDawnB, dawnWeight);

            const sunsetWeight = sunsetFactor * 0.60;
            ambR = mix(ambR, effSunsetR, sunsetWeight);
            ambG = mix(ambG, effSunsetG, sunsetWeight);
            ambB = mix(ambB, effSunsetB, sunsetWeight);

            const rainDim = normRain * 0.40;
            ambR = mix(ambR, ambR * 0.82, rainDim);
            ambG = mix(ambG, ambG * 0.86, rainDim);
            ambB = mix(ambB, ambB * 0.92, rainDim);

            const baseMoon = (MOON_BOOST > 0.001) ? (currentWeather.moonBoost / MOON_BOOST) : 1.0;
            const isFullMoonNight = Math.max(0.0, Math.min(1.0, (baseMoon - 1.00) / 0.60));

            const fallbackDawnMist = smoothstep(sunrise - 1.2, sunrise - 0.1, currentHour)
                * (1.0 - smoothstep(sunrise + 0.6, sunrise + 1.8, currentHour))
                * (hasInitializedWeather ? 0.0 : 0.18);
            const autoMist = Math.max(currentWeather.apiMist, fallbackDawnMist);

            let morningMistWindow = autoMist;
            if (MIST_MODE === 1) {
                morningMistWindow = 1.0;
            } else if (MIST_MODE === 2) {
                morningMistWindow = 0.0;
            } else if (MIST_MODE === 3) {
                morningMistWindow = Math.max(0.0, Math.min(1.0, MANUAL_MIST));
            }

            const warmth = currentWeather.mistWarmth;
            const mistProgress = smoothstep(sunrise - 0.35, sunrise + 0.35, currentHour);
            const mistDayR = mix(mix(0.92, 1.0, dawnFactor), 0.96, warmth);
            const mistDayG = mix(mix(0.95, 0.97, dawnFactor), 0.91, warmth);
            const mistDayB = mix(mix(1.0, 0.92, dawnFactor), 0.80, warmth);

            const mistR = mix(mix(0.35, 0.45, warmth), mistDayR, mistProgress);
            const mistG = mix(mix(0.45, 0.48, warmth), mistDayG, mistProgress);
            const mistB = mix(mix(0.60, 0.50, warmth), mistDayB, mistProgress);

            const sunVisibility = smoothstep(0.20, 0.55, dayFactor) * (1.0 - finalCloudCover * 0.65) * (1.0 - normRain);
            const moonEmerge = smoothstep(0.15, 0.85, nightFactor) * Math.max(0.0, 1.0 - Math.max(dawnFactor, sunsetFactor) * 0.90);
            const moonVisibility = moonEmerge * (1.0 - finalCloudCover * 0.70) * (1.0 - normRain * 0.65);
            const dayCausticWeight = Math.max(0.0, sunVisibility) * CAUSTIC_BOOST;
            const nightCausticWeight = Math.max(0.0, moonVisibility) * currentWeather.moonBoost * CAUSTIC_BOOST;

            const rayWindow = Math.max(dawnRay, sunsetRay) * Math.max(0.0, Math.min(1.0, 1.0 - finalCloudCover)) * (1.0 - normRain) * RAY_BOOST;
            const sunsetRatio = sunsetFactor / (dawnFactor + sunsetFactor + 0.0001);
            const rayColR = 1.00;
            const rayColG = mix(0.90, 0.60, sunsetRatio);
            const rayColB = mix(0.78, 0.35, sunsetRatio);

            const moonBeamWeight = 0.14 * currentWeather.moonBoost * moonEmerge * (1.0 - normRain * 0.50);
            const moonLumWeight = 0.30 * currentWeather.moonBoost * moonEmerge;
            const moonGlimmerWeight = 0.40 * currentWeather.moonBoost * moonEmerge;

            const desatFactor = nightFactor * mix(0.30, 0.20, isFullMoonNight);
            const glintWeight = (dayFactor > 0.20) ? (0.50 * dayFactor * (1.0 - finalCloudCover * 0.60) * (1.0 - normRain) * GLINT_BOOST) : 0.0;
            const starWeight = (nightFactor > 0.30 && finalCloudCover < 1.0) ? (1.50 * nightFactor * STAR_BOOST * Math.max(0.0, Math.min(1.0, 1.0 - finalCloudCover))) : 0.0;
            const fireflyWeight = (normRain > 0.005 || currentWeather.rainIntensity > 0.01) ? 0.0 : (nightFactor * mix(0.55, 1.00, finalCloudCover) * 1.60 * FIREFLY_BOOST);

            if (gl && !gl.isContextLost() && program) {
                setUniform1f(uTimeLoc, accumulatedTime);
                setUniform1f(uRainIntensityLoc, currentWeather.rainIntensity);
                setUniform3f(uWindParamsLoc, cloudOffsetX, cloudOffsetY, windSlant);

                setUniform3f(uAmbientLoc, ambR, ambG, ambB);
                setUniform4f(uDayNightFactorsLoc, dayFactor, nightFactor, dawnFactor, sunsetFactor);
                setUniform2f(uWeatherFactorsLoc, normRain, finalCloudCover);
                setUniform4f(uMistParamsLoc, mistR, mistG, mistB, morningMistWindow);

                setUniform2f(uCausticWeightsLoc, dayCausticWeight, nightCausticWeight);
                setUniform4f(uRayColorAndWindowLoc, rayColR, rayColG, rayColB, rayWindow);
                setUniform4f(uMoonParamsLoc, isFullMoonNight, moonBeamWeight, moonLumWeight, moonGlimmerWeight);
                const isRaining = (normRain > 0.005 || currentWeather.rainIntensity > 0.01);
                if (isRaining) {
                    wingDryingState.wasRaining = true;
                    wingDryingState.rainStopTime = 0;
                    const rainWetness = Math.max(0.40, normRain);
                    wingDryingState.wetness += (rainWetness - wingDryingState.wetness) * Math.min(1.0, dt * 3.0);
                    wingDryingState.wetnessAtStop = wingDryingState.wetness;
                } else if (wingDryingState.wasRaining) {
                    if (wingDryingState.rainStopTime <= 0) {
                        wingDryingState.rainStopTime = Date.now();
                        wingDryingState.wetnessAtStop = Math.max(0.40, wingDryingState.wetness);
                        try {
                            localStorage.setItem(WING_DRYING_KEY, JSON.stringify({
                                rainStopTime: wingDryingState.rainStopTime,
                                wetnessAtStop: wingDryingState.wetnessAtStop
                            }));
                        } catch (e) { }
                    }
                    const elapsedSec = (Date.now() - wingDryingState.rainStopTime) * 0.001;
                    if (elapsedSec < 1800.0) {
                        const dryingFactor = Math.max(0.0, 1.0 - (elapsedSec / 1800.0));
                        wingDryingState.wetness = wingDryingState.wetnessAtStop * dryingFactor;
                    } else {
                        wingDryingState.wetness = 0.0;
                        wingDryingState.wasRaining = false;
                        wingDryingState.rainStopTime = 0;
                        try {
                            localStorage.removeItem(WING_DRYING_KEY);
                        } catch (e) { }
                    }
                } else {
                    wingDryingState.wetness = 0.0;
                }
                const isNight = (nightFactor > 0.20 && dayFactor < 0.10);

                const naturalShowerActive = updateMeteorShowerSchedule(currentHour, sunrise, sunset, isRaining);
                const meteorShowerWeight = (!isRaining && isNight && (METEOR_SHOWER_ALWAYS_ON || naturalShowerActive)) ? 1.0 : 0.0;

                let meteorWeight = 0.0;
                if (!isRaining && isNight && finalCloudCover < 0.90) {
                    const baseMeteor = nightFactor * (1.0 - finalCloudCover * 0.70) * METEOR_BOOST;
                    meteorWeight = (meteorShowerWeight > 0.001) ? Math.max(baseMeteor, METEOR_BOOST) : baseMeteor;
                }

                let starProg = -1.0;
                let starSeed1 = 0.5;
                let starSeed2 = 0.5;
                let sporadicWeight = 0.0;

                const isDryNight = (!isRaining && isNight && finalCloudCover < 0.90 && meteorShowerWeight <= 0.001);

                if (isDryNight) {
                    if (starPityState.activeStar) {
                        const starAge = (now - starPityState.activeStar.startTime) * 0.001;
                        if (starAge >= starPityState.activeStar.dur) {
                            starPityState.activeStar = null;
                            starPityState.elapsedDryNightSec = 0;
                            starPityState.lastCheckStep = 0;
                            starPityState.chance = 0.1;
                            try {
                                localStorage.setItem(STAR_PITY_KEY, JSON.stringify({
                                    chance: 0.1,
                                    elapsedDryNightSec: 0,
                                    lastCheckStep: 0
                                }));
                            } catch (e) { }
                        } else {
                            starProg = starAge / starPityState.activeStar.dur;
                            starSeed1 = starPityState.activeStar.seed1;
                            starSeed2 = starPityState.activeStar.seed2;
                            sporadicWeight = 1.0;
                        }
                    } else {
                        starPityState.elapsedDryNightSec += dt;
                        const elapsed = starPityState.elapsedDryNightSec;
                        if (elapsed >= 30.0) {
                            const currentStep = Math.floor(elapsed / 30.0);
                            if (currentStep > starPityState.lastCheckStep) {
                                starPityState.lastCheckStep = currentStep;
                                const stepChance = Math.min(1.0, 0.10 + (currentStep - 1) * (0.90 / 59.0));
                                starPityState.chance = stepChance;
                                const roll = Math.random();
                                if (roll < stepChance || currentStep >= 60) {
                                    triggerSporadicStar(now);
                                    starProg = 0.0;
                                    starSeed1 = starPityState.activeStar.seed1;
                                    starSeed2 = starPityState.activeStar.seed2;
                                    sporadicWeight = 1.0;
                                }
                                try {
                                    localStorage.setItem(STAR_PITY_KEY, JSON.stringify({
                                        chance: starPityState.chance,
                                        elapsedDryNightSec: starPityState.elapsedDryNightSec,
                                        lastCheckStep: starPityState.lastCheckStep
                                    }));
                                } catch (e) { }
                            }
                        }
                    }
                } else {
                    starPityState.activeStar = null;
                }

                const showerAngle = meteorPityState.showerAngle || 3.65;
                const showerDirX = Math.cos(showerAngle);
                const showerDirY = Math.sin(showerAngle);

                setUniform1f(uMeteorWeightLoc, meteorWeight);
                setUniform1f(uMeteorShowerLoc, meteorShowerWeight);
                setUniform2f(uMeteorShowerDirLoc, showerDirX, showerDirY);
                setUniform4f(uSporadicStarLoc, starProg, starSeed1, starSeed2, sporadicWeight);
                setUniform1f(uWingDropletsLoc, wingDryingState.wetness);
                setUniform4f(uMiscFactorsLoc, desatFactor, glintWeight, starWeight, fireflyWeight);

                gl.drawArrays(gl.TRIANGLES, 0, 3);
            }
        }

        animationFrameId = requestAnimationFrame(render);
    </script>
</body>
